<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Soirée jeux – Hôte</title><link rel="stylesheet" href="style.css"></head>
<body><main class="host stack" id="app"></main>
<button class="audio-toggle" data-audio-toggle type="button">🔇 Activer le son</button>
<script src="/audio.js"></script><script src="/avatars.js"></script>
<script src="/socket.io/socket.io.js"></script>
<script>document.addEventListener('click', e => { if (e.target.closest('button') && !e.target.closest('[data-audio-toggle]')) window.partyAudio.click(); }, true);</script>
<script>
const s = io(); let st = null, off = 0, sel = null, drawSyncN = null, lastDrawSeq = 0, drawSyncTimer = null, renderError = null;
const app = document.getElementById('app');
const esc = t => String(t).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
s.emit('host:create');
s.on('state', x => { window.AVATARS=x.avatars||window.AVATARS||[]; st = x; off = x.now - Date.now(); renderError = null; try { render(); } catch (err) { renderError = err; renderFallback(err); console.error('[host render]', err); } window.partyAudio.update(x); });
document.querySelector('[data-audio-toggle]').onclick = () => window.partyAudio.toggle();
s.on('closed', () => location.reload());
function startDrawResync(n) {
  clearInterval(drawSyncTimer);
  drawSyncTimer = setInterval(() => { if (st?.phase?.kind === 'draw' && st.phase.n === n) s.emit('host:sync-draw'); }, 1000);
}
function stopDrawResync() { clearInterval(drawSyncTimer); drawSyncTimer = null; lastDrawSeq = 0; }
function hexToRgba(hex){ const n=parseInt(hex.slice(1),16); return [n>>16,(n>>8)&255,n&255,255]; }
function floodFillCanvas(cv,x,y,color){
  const c=cv.getContext('2d',{willReadFrequently:true}), w=cv.width,h=cv.height,px=Math.floor(x*w),py=Math.floor(y*h);
  const img=c.getImageData(0,0,w,h),d=img.data, idx=(py*w+px)*4, target=[d[idx],d[idx+1],d[idx+2],d[idx+3]], fc=hexToRgba(color);
  if(target.every((v,i)=>v===fc[i])) return;
  const same=i=>d[i]===target[0]&&d[i+1]===target[1]&&d[i+2]===target[2]&&d[i+3]===target[3], stack=[[px,py]], seen=new Uint8Array(w*h);
  while(stack.length){const [cx,cy]=stack.pop();if(cx<0||cy<0||cx>=w||cy>=h)continue;const si=cy*w+cx;if(seen[si])continue;const i=si*4;if(!same(i))continue;seen[si]=1;d[i]=fc[0];d[i+1]=fc[1];d[i+2]=fc[2];d[i+3]=fc[3];stack.push([cx+1,cy],[cx-1,cy],[cx,cy+1],[cx,cy-1]);}
  c.putImageData(img,0,0);
}
function paintSegments(segs, replace=false){
  const cv=document.getElementById('cv'); if(!cv)return; const c=cv.getContext('2d');
  if(replace)c.clearRect(0,0,cv.width,cv.height);
  (segs||[]).forEach(op=>{
    const color=op.color||'#1d1a3b', width=op.width||6, tool=op.tool||'pen';
    c.lineWidth=width; c.lineCap='round';c.lineJoin='round';c.strokeStyle=tool==='eraser'?'#ffffff':color;
    const list=op.segs||[]; list.forEach(([x0,y0,x1,y1])=>{c.beginPath();c.moveTo(x0*cv.width,y0*cv.height);c.lineTo(x1*cv.width,y1*cv.height);c.stroke();});
  });
}
function paintOps(ops, replace=false){
  const cv=document.getElementById('cv'); if(!cv)return; if(replace)cv.getContext('2d').clearRect(0,0,cv.width,cv.height);
  (ops||[]).forEach(op=>{ if(op.action==='segments')paintSegments([op]); else if(op.action==='fill')floodFillCanvas(cv,op.x,op.y,op.color||'#1d1a3b'); });
}
s.on('draw',d=>{
  const cv=document.getElementById('cv'); if(!cv||!st?.phase||st.phase.kind!=='draw'||st.phase.n!==d.n)return;
  if(d.full){lastDrawSeq=d.seq||lastDrawSeq;return paintOps(d.ops||[],true);}
  if(d.seq&&d.seq<=lastDrawSeq)return; lastDrawSeq=d.seq||lastDrawSeq;
  if(d.clear)return paintOps([],true);
  if(d.action==='fill')return floodFillCanvas(cv,d.x,d.y,d.color||'#1d1a3b');
  if(d.action==='segments')paintSegments([d],false);
  if(d.action==='undo')return paintOps(d.ops||[],true);
});
setInterval(() => {
  const t = document.getElementById('t');
  if (t && st.phase.endsAt) t.textContent = Math.max(0, Math.ceil((st.phase.endsAt - Date.now() - off) / 1000));
}, 250);
const avatarMarkup = (id,size=64,mood='happy') => window.renderAvatar ? window.renderAvatar(id,size,mood) : '';
const nameOf = id => { const x = (st?.players || []).find(p => p.id === id); return x ? x.name : 'Joueur'; };
const timer = p => p?.endsAt ? `<span class="host-timer" id="t">${Math.max(0, Math.ceil((p.endsAt - Date.now() - off) / 1000))}</span>` : '';
const phaseLabel = p => ({ text:'Répondez', number:'Estimation', guess:'Trouvez', rank:'Classement', truths:'2 vérités / 1 mensonge', describe:'Indice', draw:'Dessin en direct', vote:'Vote', reveal:'Résultats', scores:'Classement final' }[p?.kind] || p?.kind || 'Manche');
const head = p => {
  const round = p?.round && p?.rounds ? `<span class="chip">Manche ${p.round}/${p.rounds}</span>` : '';
  const category = p?.category ? `<span class="chip">${esc(p.category)}</span>` : '';
  const answered = Array.isArray(p?.answered) ? p.answered.length : 0;
  const expected = Array.isArray(p?.expected) ? p.expected.length : 0;
  const progress = expected ? `<span class="chip">${answered}/${expected} réponses</span>` : '';
  return `<header class="game-head"><div><div class="eyebrow">${esc(phaseLabel(p))}</div><h1>${esc(p?.title || 'La partie continue !')}</h1><div class="host-chips">${category}${round}${progress}</div></div><div>${timer(p)}</div></header>`;
};
const scoreBoard = () => {
  const rows = [...(st?.players || [])].sort((a,b)=>b.score-a.score);
  return `<aside class="live-scores card"><div class="section-title"><span>🏆 Scores en direct</span><small>${rows.length} joueur${rows.length>1?'s':''}</small></div>${rows.map((x,i)=>`<div class="live-score-row"><span>${i+1}</span><span class="live-score-avatar">${avatarMarkup(x.avatar,38,'happy')}</span><b>${esc(x.name)}</b><strong>${x.score}</strong></div>`).join('')}</aside>`;
};
const liveAnswers = p => {
  const rows = Array.isArray(p?.answers) ? p.answers : [];
  if (!rows.length) return `<section class="live-answers card"><div class="section-title"><span>💬 Réponses en direct</span><small>En attente…</small></div><p class="muted">Les réponses apparaîtront ici dès qu’elles arrivent.</p></section>`;
  const fmt = v => { if (Array.isArray(v)) return v.join(' → '); if (v && typeof v === 'object') return JSON.stringify(v); return String(v ?? ''); };
  return `<section class="live-answers card"><div class="section-title"><span>💬 Réponses en direct</span><small>${rows.length} reçue${rows.length>1?'s':''}</small></div>${rows.map((r,i)=>`<div class="live-answer-row"><span class="answer-avatar">${avatarMarkup(((st.players || []).find(x=>x.id===r.id)||{}).avatar,42,'happy')}</span><div><b>${esc(r.name)}</b><div class="answer-text">${esc(fmt(r.value))}</div></div><span class="answer-check">✓</span></div>`).join('')}</section>`;
};
const progress = p => {
  const answered = Array.isArray(p?.answered) ? p.answered : [];
  const expected = Array.isArray(p?.expected) ? p.expected : [];
  const done = expected.length ? answered.length / expected.length : 0;
  const names = answered.map(nameOf).map(esc).join(' · ');
  return `<section class="answer-progress card"><div class="progress-top"><b>${answered.length} réponse${answered.length>1?'s':''}</b><span>${expected.length ? `sur ${expected.length}` : 'en cours'}</span></div><div class="progress-bar"><i style="width:${Math.round(done*100)}%"></i></div>${names ? `<p class="muted">${names}</p>` : '<p class="muted">Les joueurs répondent…</p>'}</section>`;
};
function renderFallback(err) {
  if (!st) return;
  const p = st.phase || {};
  app.innerHTML = `<section class="card stack host-error"><span class="chip bad">Écran hôte</span><h1>${esc(p.title || 'La manche est en cours')}</h1><p>La partie a bien changé de phase, mais cet écran n’a pas encore de vue dédiée. Le jeu continue.</p><p class="muted">Phase reçue : ${esc(p.kind || 'inconnue')}</p><button id="retry-render">Réafficher</button></section>`;
  const b=document.getElementById('retry-render'); if(b) b.onclick=()=>{ renderError=null; try{render();}catch(e){renderFallback(e);} };
}
const antics=['Le champion parade !','Deux joueurs se chamaillent pour la 2e place !','Quelqu’un tente une pose de victoire…','Ça rigole au fond !','Un duel de regards est lancé !','Tout le monde félicite le leader !','Le dernier prépare sa revanche !'];
let anticIndex=Math.floor(Math.random()*antics.length);
const rankBoard = (items, final=false) => { const names=['winner','p2','p3','p4','p5']; const scene=final?antics[anticIndex%antics.length]:'La partie commence déjà à chambrer…'; return `<div class="rank-scene"><div class="scene-prop">${esc(scene)}</div><div class="scene-floor"></div>${items.slice(0,5).map((x,i)=>`<div class="scene-player ${names[i]}"><div>${avatarMarkup(x.avatar,82,['smug','grimace','sleepy','happy','smug'][i%5])}</div><span class="scene-name">${esc(x.name)}${final?' · '+x.score+' pts':''}</span></div>`).join('')}</div><div class="rank-list">${items.map((x,i)=>`<div class="rank-row"><div class="rank-place">${i+1}</div><div class="rank-avatar">${avatarMarkup(x.avatar,58,['smug','grimace','sleepy','happy'][i%4])}</div><div class="rank-name"><b>${esc(x.name)}</b><span>${final?x.score+' pts':'prêt à jouer'}</span></div></div>`).join('')}</div>`; };
setInterval(()=>{ if(st && st.phase && (st.phase.kind==='lobby' || st.phase.kind==='scores')) { anticIndex++; render(); } }, 6500);
function render() {
  const p = st.phase || { kind:'lobby' }, pl = st.players || [];
  if (p.kind === 'error') {
    stopDrawResync();
    app.innerHTML = `<section class="card stack host-error"><span class="chip bad">Erreur</span><h1>${esc(p.title || 'Erreur')}</h1><p>${esc(p.prompt || 'Un problème est survenu.')}</p><p class="muted">${esc(p.error || '')}</p><button id="back">Retour au menu</button></section>`;
    document.getElementById('back').onclick=()=>s.emit('host:lobby');
  } else if (p.kind === 'lobby') {
    const ok = pl.length >= st.min && sel;
    app.innerHTML = `
      <div class="muted">Sur votre téléphone, ouvrez <b>${location.host}/play.html</b> et entrez le code :</div>
      <div class="code">${st.code}</div>
      <section class="home-ranking"><div class="section-title"><span>🏆 Classement de la soirée</span><small>Les joueurs peuvent encore arriver…</small></div>${pl.length ? rankBoard([...pl].sort((a,b)=>b.score-a.score)) : '<div class="empty-ranking">Les premiers joueurs vont apparaître ici 👀</div>'}</section>
      <div class="games">${st.games.map(g => `<button class="card ${sel === g.id ? 'sel' : ''}" data-g="${g.id}"><span class="game-cat chip">${esc(g.category || 'Général')}</span><span class="game-title">${esc(g.name)}</span><span class="game-desc">${esc(g.desc)}</span></button>`).join('')}</div>
      <div><button class="alt" id="go" ${ok ? '' : 'disabled'}>Lancer la partie</button>
      <span class="muted"> ${pl.length < st.min ? `Il faut au moins ${st.min} joueurs.` : !sel ? 'Choisissez un jeu.' : ''}</span></div>`;
    app.querySelectorAll('[data-g]').forEach(b => b.onclick = () => { window.partyAudio.click(); sel = b.dataset.g; render(); });
    document.getElementById('go').onclick = () => { window.partyAudio.enable(); s.emit('host:start', sel); };
  } else if (p.kind === 'text' || p.kind === 'number') {
    app.innerHTML = `<div class="host-game-grid"><div><div class="host-main">${head(p)}<div class="prompt">${esc(p.prompt)}</div>${progress(p)}${liveAnswers(p)}</div></div>${scoreBoard()}</div>`;
  } else if (p.kind === 'guess') {
    const name = id => (st.players.find(x => x.id === id) || {}).name || '';
    const ids = [...p.data.found, ...p.answered];
    app.innerHTML = `<div class="host-game-grid"><div><div class="host-main">${head(p)}<p class="muted">${esc(p.prompt)}</p>
      <div class="stack">${p.data.clues.map(c => `<div class="clue ${/^[^\p{L}]+$/u.test(c) ? 'emoji' : ''}">${esc(c)}</div>`).join('')}</div>
      <div class="chips">${ids.map(id => `<span class="chip">${esc(name(id))} a trouvé !</span>`).join('')}</div>${liveAnswers(p)}</div></div>${scoreBoard()}</div>`;
  } else if (p.kind === 'rank') {
    app.innerHTML = `<div class="host-game-grid"><div class="host-main">${head(p)}<div class="prompt">${esc(p.prompt)}</div><div class="items">${p.data.items.map(i => `<div class="card opt">${esc(i.text)}</div>`).join('')}</div>${progress(p)}${liveAnswers(p)}</div>${scoreBoard()}</div>`;
  } else if (p.kind === 'truths') {
    app.innerHTML = `<div class="host-game-grid"><div class="host-main">${head(p)}<div class="prompt">Sur votre téléphone : écrivez 2 vérités et 1 mensonge sur vous !</div>${progress(p)}${liveAnswers(p)}</div>${scoreBoard()}</div>`;
  } else if (p.kind === 'describe') {
    app.innerHTML = `<div class="host-game-grid"><div class="host-main">${head(p)}<div class="prompt">${esc(nameOf(p.data.describer))} prépare un indice…</div>${liveAnswers(p)}</div>${scoreBoard()}</div>`;
  } else if (p.kind === 'draw') {
    if (app.dataset.dn != p.n) {
      stopDrawResync();
      app.dataset.dn = p.n;
      drawSyncN = p.n;
      app.innerHTML = `<div class="host-game-grid draw-layout"><div class="host-main">${head(p)}<p class="muted" id="who"></p><canvas id="cv" class="board" width="800" height="600"></canvas><div class="chips" id="fc"></div>${liveAnswers(p)}</div>${scoreBoard()}</div>`;
      s.emit('host:sync-draw'); startDrawResync(p.n);
    }
    document.getElementById('who').textContent = `${nameOf(p.data.drawer)} dessine : devinez sur votre téléphone !`;
    document.getElementById('fc').innerHTML = p.answered.map(id => `<span class="chip">${esc(nameOf(id))} a trouvé !</span>`).join('');
  } else if (p.kind === 'vote') {
    stopDrawResync();
    app.innerHTML = `<div class="host-game-grid"><div class="host-main">${head(p)}<div class="prompt">${esc(p.prompt)}</div><div class="stack">${p.options.map(o => `<div class="card opt">${esc(o.text)}</div>`).join('')}</div>${progress(p)}${liveAnswers(p)}</div>${scoreBoard()}</div>`;
  } else if (p.kind === 'reveal') {
    stopDrawResync();
    app.innerHTML = `${head(p)}<h1>${esc(p.title)}</h1>
      <div class="card">${p.lines.map(l => `<div class="line"><div><b>${esc(l.main)}</b><br>${esc(l.sub)}</div><span class="pts">+${l.pts}</span></div>`).join('') || 'Aucun point cette manche.'}</div>
      <div><button id="next">Suivant</button></div>`;
    document.getElementById('next').onclick = () => { window.partyAudio.click(); s.emit('host:skip'); };
  } else if (p.kind === 'scores') {
    stopDrawResync();
    const r = [...pl].sort((a, b) => b.score - a.score);
    app.innerHTML = `<h1 class="big" style="font-size:4rem">Classement final</h1><p class="muted score-subtitle">Place aux célébrations 🎉</p>${rankBoard(r,true)}
      <div><button id="back">Retour au menu</button></div>`;
    document.getElementById('back').onclick = () => { window.partyAudio.click(); s.emit('host:lobby'); };
  }
}
</script></body></html>
