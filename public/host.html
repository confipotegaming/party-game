function hexToRgba(hex){ const n=parseInt(hex.slice(1),16); return [n>>16,(n>>8)&255,n&255,255]; }
function floodFillCanvas(cv,x,y,color){
  const c=cv.getContext('2d',{willReadFrequently:true}), w=cv.width,h=cv.height,px=Math.floor(x*w),py=Math.floor(y*h);
  const img=c.getImageData(0,0,w,h),d=img.data, idx=(py*w+px)*4, target=[d[idx],d[idx+1],d[idx+2],d[idx+3]], fc=hexToRgba(color);
  if(target.every((v,i)=>v===fc[i])) return;

  while(stack.length){const [cx,cy]=stack.pop();if(cx<0||cy<0||cx>=w||cy>=h)continue;const si=cy*w+cx;if(seen[si])continue;const i=si*4;if(!same(i))continue;seen[si]=1;d[i]=fc[0];d[i+1]=fc[1];d[i+2]=fc[2];d[i+3]=fc[3];stack.push([cx+1,cy],[cx-1,cy],[cx,cy+1],[cx,cy-1]);}

}
function paintSegments(segs, replace=false){
  const cv=document.getElementById('cv'); if(!cv)return; const c=cv.getContext('2d');
  if(replace)c.clearRect(0,0,cv.width,cv.height);

    const color=op.color||'#1d1a3b', width=op.width||6, tool=op.tool||'pen';
    c.lineWidth=width; c.lineCap='round';c.lineJoin='round';c.strokeStyle=tool==='eraser'?'#ffffff':color;
    const list=op.segs||[]; list.forEach(([x0,y0,x1,y1])=>{c.beginPath();c.moveTo(x0*cv.width,y0*cv.height);c.lineTo(x1*cv.width,y1*cv.height);c.stroke();});

}
function paintOps(ops, replace=false){

s.on('draw',d=>{

const DIFF_MODES = [['mix', '🎢 Progressive', 'Du facile au difficile'], ['1', '★☆☆ Facile', 'Pour s’échauffer'], ['2', '★★☆ Moyen', 'Un bon défi'], ['3', '★★★ Difficile', 'Pour les cracks (bonus ×1,5)']];

const antics=['Le champion parade !','Deux joueurs se chamaillent pour la 2e place !','Quelqu’un tente une pose de victoire…','Ça rigole au fond !','Un duel de regards est lancé !','Tout le monde félicite le leader !','Le dernier prépare sa revanche !'];
let anticIndex=Math.floor(Math.random()*antics.length);
const rankBoard = (items, final=false) => { const names=['winner','p2','p3','p4','p5']; const scene=window.partyBanter.pick(items,anticIndex)||antics[anticIndex%antics.length]; return `<div class="rank-scene has-banter"><div class="scene-prop banter">${esc(scene)}</div><div class="scene-floor"></div>${items.slice(0,5).map((x,i)=>`<div class="scene-player ${names[i]}"><div>${avatarMarkup(x.avatar,82,['smug','grimace','sleepy','happy','smug'][i%5])}</div><span class="scene-name">${esc(x.name)}${final?' · '+x.score+' pts':''}</span></div>`).join('')}</div><div class="rank-list">${items.map((x,i)=>`<div class="rank-row"><div class="rank-place">${i+1}</div><div class="rank-avatar">${avatarMarkup(x.avatar,58,['smug','grimace','sleepy','happy'][i%4])}</div><div class="rank-name"><b>${esc(x.name)}</b><span>${final?x.score+' pts':'prêt à jouer'}</span></div></div>`).join('')}</div>`; };
setInterval(()=>{ if(st && st.phase && (st.phase.kind==='lobby' || st.phase.kind==='scores')) { anticIndex++; render(); } }, 6500);
// ----- Mode plateau : lobby, roue des mini-jeux et plateau de course -----
const WHEEL_COLORS = ['#ffd23f', '#ff5d8f', '#35d0ba', '#8c7bff', '#ff9f43', '#4dabf7', '#a9e34b', '#f783ac'];

    <div class="board-lobby-opts"><div><b>Nombre de tours</b><div class="board-turns">${(st.boardTurns || [3, 5, 8, 10]).map(t => `<button class="${boardTurns === t ? 'sel' : ''}" data-turns="${t}">${t}</button>`).join('')}</div></div>
    <div><b>Difficulté des questions</b><div class="board-turns">${DIFF_MODES.map(([v, l]) => `<button class="${diffMode === v ? 'sel' : ''}" data-bdiff="${v}">${l}</button>`).join('')}</div></div></div>

// Roue en SVG : la case `target` finit sous le pointeur (en haut).
function wheelSvg(segs) {

  const pt = (a, r) => [R + r * Math.sin(a), R - r * Math.cos(a)];
  return `<svg viewBox="0 0 ${2 * R} ${2 * R}" class="wheel-svg"><g id="wheel-rot" style="transform-origin:${R}px ${R}px">${segs.map((g, i) => {
    const a0 = i * step, a1 = a0 + step, [x0, y0] = pt(a0, R - 6), [x1, y1] = pt(a1, R - 6), mid = (a0 + a1) / 2, deg = mid * 180 / Math.PI;
    const [ix, iy] = pt(mid, R * 0.85), [tx, ty] = pt(mid, R * 0.48);
    const name = g.name.length > 15 ? g.name.slice(0, 14) + '…' : g.name;

      <text x="${tx}" y="${ty}" class="wheel-label" text-anchor="middle" dominant-baseline="central" transform="rotate(${deg > 180 ? deg + 90 : deg - 90} ${tx} ${ty})">${esc(name)}</text>`;
  }).join('')}</g><circle cx="${R}" cy="${R}" r="${R - 4}" fill="none" stroke="#1d1a3b" stroke-width="8"/><circle cx="${R}" cy="${R}" r="38" fill="#fff" stroke="#1d1a3b" stroke-width="6"/><text x="${R}" y="${R}" font-size="38" text-anchor="middle" dominant-baseline="central">🎲</text></svg>`;
}
let wheelLoop = null;
function renderBoardSpin(p) {
  const d = p.data, n = d.segments.length, seg = 360 / n;
  if (app.dataset.wheel != p.n) {
    app.dataset.wheel = p.n;

    };

  }

// ----- Cerveau Turbo : suivi en direct puis résultats -----
const brainTypes = { add:'➕ Addition', sub:'➖ Soustraction', mul:'✖️ Multiplication', missing:'❓ Nombre manquant', chain:'🔗 Calcul en chaîne', sequence:'🔢 Suite logique', odd:'🔍 Intrus', least:'⚖️ Comparaison', pattern:'🔷 Formes', memo:'🧠 Mémoire', shell:'🃏 Bonneteau', simon:'🎨 Séquence', colorTap:'🎯 Couleur', green:'🟢 Feu vert', starOnly:'⭐ Réflexe', compare:'📏 Plus grand', count:'🧮 Comptage', twice:'👯 Doublon' };
function brainClock() {
  const p = st?.phase; if (!p || (p.kind !== 'brain' && p.kind !== 'wario')) return;
  const t = Date.now() + off, start = p.data.startAt, left = start + p.data.playMs - t;

    const ids = [...p.data.found, ...p.answered];
    app.innerHTML = `<div class="host-game-grid"><div><div class="host-main">${head(p)}<p class="muted">${esc(p.prompt)}</p>
      <div class="stack">${p.data.clues.map(c => `<div class="clue ${/^[^\p{L}]+$/u.test(c) ? 'emoji' : ''}">${esc(c)}</div>`).join('')}</div>
      <div class="chips">${ids.map(id => `<span class="chip">${esc(name(id))} a trouvé !</span>`).join('')}</div>${liveAnswers(p)}</div>${stopGameButton()}</div></div>${scoreBoard()}</div>`;
    bindStop();
  } else if (p.kind === 'rank') {
    app.innerHTML = `<div class="host-game-grid"><div class="host-main">${head(p)}<div class="prompt">${esc(p.prompt)}</div><div class="items">${p.data.items.map(i => `<div class="card opt">${esc(i.text)}</div>`).join('')}</div>${progress(p)}${liveAnswers(p)}${stopGameButton()}</div>${scoreBoard()}</div>`;
    bindStop();
  } else if (p.kind === 'truths') {
    app.innerHTML = `<div class="host-game-grid"><div class="host-main">${head(p)}<div class="prompt">Sur votre téléphone : écrivez 2 vérités et 1 mensonge sur vous !</div>${progress(p)}${liveAnswers(p)}${stopGameButton()}</div>${scoreBoard()}</div>`;
    bindStop();
  } else if (p.kind === 'describe') {
    app.innerHTML = `<div class="host-game-grid"><div class="host-main">${head(p)}<div class="prompt">${esc(nameOf(p.data.describer))} prépare un indice…</div>${liveAnswers(p)}${stopGameButton()}</div>${scoreBoard()}</div>`;
    bindStop();
  } else if (p.kind === 'draw') {
    if (app.dataset.dn != p.n) {
      stopDrawResync();
      app.dataset.dn = p.n;
      drawSyncN = p.n;
      app.innerHTML = `<div class="host-game-grid draw-layout"><div class="host-main">${head(p)}<p class="muted" id="who"></p><canvas id="cv" class="board" width="800" height="600"></canvas><div class="chips" id="fc"></div>${liveAnswers(p)}</div>${scoreBoard()}</div>`;
      s.emit('host:sync-draw'); startDrawResync(p.n);
    }
    document.getElementById('who').textContent = `${nameOf(p.data.drawer)} dessine : devinez sur votre téléphone !`;
    document.getElementById('fc').innerHTML = p.answered.map(id => `<span class="chip">${esc(nameOf(id))} a trouvé !</span>`).join('');
  } else if (p.kind === 'vote') {
    stopDrawResync();
    app.innerHTML = `<div class="host-game-grid"><div class="host-main">${head(p)}<div class="prompt">${esc(p.prompt)}</div><div class="stack">${p.options.map(o => `<div class="card opt">${esc(o.text)}</div>`).join('')}</div>${progress(p)}${liveAnswers(p)}${stopGameButton()}</div>${scoreBoard()}</div>`;
    bindStop();
  } else if (p.kind === 'reveal') {
    stopDrawResync();
    app.innerHTML = `${head(p)}<h1>${esc(p.title)}</h1>${p.data?.survey ? `<div class="prompt">${esc(p.prompt)}</div>${window.SurveyGame.reveal(p.data.survey)}` : ''}${p.data?.pixel ? window.PixelGame.reveal(p.data.pixel) : ''}
      <div class="card">${p.lines.map(l => `<div class="line"><div><b>${esc(l.main)}</b><br>${esc(l.sub)}</div><span class="pts">+${l.pts}</span></div>`).join('') || 'Aucun point cette manche.'}</div>
      <div><button id="next">Suivant</button></div>`;
    document.getElementById('next').onclick = () => { window.partyAudio.click(); s.emit('host:skip'); };
  } else if (p.kind === 'scores') {
    stopDrawResync();
    const r = [...pl].sort((a, b) => b.score - a.score);
    const bd = p.data && p.data.standings ? p.data : null;
    if (bd) { const rk = Object.fromEntries(bd.standings.map((x, i) => [x.id, i])); r.sort((a, b) => (rk[a.id] ?? 99) - (rk[b.id] ?? 99)); }
    app.innerHTML = `<h1 class="big" style="font-size:4rem">${bd ? '🎲 Vainqueur du plateau' : 'Classement final'}</h1><p class="muted score-subtitle">${bd ? `${bd.log.length} mini-jeu${bd.log.length > 1 ? 'x' : ''} joué${bd.log.length > 1 ? 's' : ''} · égalité départagée au nombre de victoires` : 'Place aux célébrations 🎉'}</p>${rankBoard(r,true)}${bd ? boardTrack(bd) + boardLog(bd) : ''}
      <div><button id="back">Retour au menu</button></div>`;
    document.getElementById('back').onclick = () => { window.partyAudio.click(); s.emit('host:lobby'); };
  }
}
</script></body></html>
