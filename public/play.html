<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Soirée jeux</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="showtv.css"></head>
<body><div class="studio-beams"><i></i><i></i><i></i><i></i></div><main class="play stack" id="app"></main>
<button class="audio-toggle" data-audio-toggle type="button">🔇 Activer le son</button>
<script src="/audio.js"></script><script src="/avatars.js"></script><script src="/banter.js"></script><script src="/brain.js"></script><script src="/sondage.js"></script><script src="/academy.js"></script><script src="/wario.js"></script><script src="/boss.js"></script><script src="/pixel.js"></script><script src="/mascot.js"></script><script src="/showfx.js"></script>
<script src="/socket.io/socket.io.js"></script>
<script>document.addEventListener('click', e => { if (e.target.closest('button') && !e.target.closest('[data-audio-toggle]')) window.partyAudio.click(); }, true);</script>
<script>
const s = io(); const app = document.getElementById('app');
const esc = t => String(t).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let joined = null, st = null, off = 0, key = '', chosenAvatar = (() => { try { return JSON.parse(localStorage.getItem('pg-avatar') || 'null') || window.defaultPony(); } catch { return window.defaultPony(); } })();
function avatarMarkup(id,size=62,mood='happy'){ return window.renderAvatar ? window.renderAvatar(id,size,mood) : ''; }
document.querySelector('[data-audio-toggle]').onclick = () => window.partyAudio.toggle();
const saved = () => { try { return JSON.parse(localStorage.getItem('pg') || 'null'); } catch { return null; } };

function join(code, name, pid, avatar) {
  s.emit('join', { code, name, pid, avatar }, r => {
    if (r.error) { localStorage.removeItem('pg'); joined = null; return form(r.error); }
    joined = { code: code.toUpperCase(), pid: r.pid, name: r.name, avatar: avatar || chosenAvatar };
    chosenAvatar = joined.avatar; localStorage.setItem('pg', JSON.stringify(joined)); localStorage.setItem('pg-avatar', JSON.stringify(chosenAvatar));
  });
}
s.on('connect', () => { const j = joined || saved(); if (j) { chosenAvatar=j.avatar||chosenAvatar; join(j.code, j.name, j.pid, chosenAvatar); } else form(); });
s.on('boss', snap => window.BossGame.onSnap(snap)); // Boss Fight : état du combat en temps réel
s.on('closed', () => { localStorage.removeItem('pg'); joined = null; form('La partie est terminée.'); });

function form(err = '') {
  key = '';
  document.body.classList.remove('cc-open');
  app.innerHTML = `<header class="cc-head"><div class="cc-steps"><span class="on">Inscription</span><i></i><span>Ton personnage</span><i></i><span>Le plateau</span></div>
    <h1 class="cc-title">Rejoins le <em>plateau</em></h1></header>
    <div id="join-step" class="card stack join-card">
      <input id="c" placeholder="Code de partie (4 lettres)" maxlength="4" autocapitalize="characters" autocomplete="off">
      <input id="n" placeholder="Votre pseudo" maxlength="14" autocomplete="off">
      <button id="next-avatar">Choisir mon avatar →</button>
      <p id="e" class="msg">${esc(err)}</p>
    </div>`;
  document.getElementById('next-avatar').onclick=()=>{
    const code=document.getElementById('c').value.trim().toUpperCase();
    const name=document.getElementById('n').value.trim();
    if(code.length!==4 || !name){ document.getElementById('e').textContent='Entrez le code et votre pseudo avant de choisir votre avatar.'; return; }
    avatarStep(code,name);
  };
}
function avatarStep(code,name){
  let pony = window.normalizePony(chosenAvatar) || window.defaultPony();
  const cat = window.PONY_CATALOG, pal = window.PONY_PALETTES;
  const tabs = [
    {label:'🦄 Type', items:[['race','races','Type de poney','full'],['silhouette','silhouettes','Silhouette','full']]},
    {label:'🎨 Pelage', items:[['coat','coats','Motif du pelage','full']], colors:[['bodyColor','Couleur du pelage','body'],['coatColor','Couleur du motif','body']]},
    {label:'💇 Crinière', items:[['mane','manes','Coiffure','head'],['streak','streaks','Style de couleur','head']], colors:[['maneColor','Couleur principale','mane'],['maneColor2','Seconde couleur / mèche','mane']]},
    {label:'🌀 Queue', items:[['tail','tails','Forme de la queue','rear']], colors:[['maneColor','Couleur (même que la crinière)','mane']]},
    {label:'👀 Yeux', items:[['eyes','eyes','Regard','head']], colors:[['eyeColor','Couleur des yeux','eye']]},
    {label:'⭐ Marque de beauté', items:[['mark','marks','Symbole','body']], colors:[['markColor','Couleur de la marque','mane']]},
    {label:'🎩 Chapeaux', items:[['hat','hats','Chapeau','head']], colors:[['accessoryColor','Couleur des accessoires','accent']]},
    {label:'👓 Lunettes', items:[['glasses','glasses','Lunettes','head']], colors:[['accessoryColor','Couleur des accessoires','accent']]},
    {label:'🎀 Cou', items:[['neck','necks','Accessoire de cou','head']], colors:[['accessoryColor','Couleur des accessoires','accent']]},
    {label:'👗 Tenue', items:[['clothes','clothes','Tenue','full']], colors:[['accessoryColor','Couleur des accessoires','accent']]},
    {label:'✨ Effets', items:[['effect','effects','Effet magique','full']], colors:[['accessoryColor','Couleur de l’effet','accent']]}
  ];
  const presets=[
    ['💜 Twilight',{race:1,bodyColor:'#c9a6e8',mane:0,tail:0,maneColor:'#2f2a7a',maneColor2:'#ec4f97',streak:1,eyes:0,eyeColor:'#6a3f9c',mark:1,markColor:'#ec4f97'}],
    ['🌈 Rainbow Dash',{race:2,bodyColor:'#9ed8f5',mane:1,tail:1,maneColor:'#ef4b4b',streak:4,eyes:7,eyeColor:'#d14d8c',mark:6,markColor:'#ef4b4b',maneColor2:'#4aa8f0'}],
    ['🎈 Pinkie Pie',{race:0,bodyColor:'#f9b8d8',mane:2,tail:2,maneColor:'#ec4f97',streak:0,eyes:8,eyeColor:'#3d7bd9',mark:3,markColor:'#5fbcf2',maneColor2:'#ffe25a',effect:6,accessoryColor:'#ff6fa8'}],
    ['💎 Rarity',{race:1,bodyColor:'#f6f4f8',mane:3,tail:3,maneColor:'#6a3f9c',streak:0,eyes:1,eyeColor:'#3d7bd9',mark:4,markColor:'#5fbcf2',effect:1,accessoryColor:'#8f6ae0'}],
    ['🍎 Applejack',{race:0,bodyColor:'#ffcf8f',mane:4,tail:4,maneColor:'#ffe25a',maneColor2:'#ef4b4b',streak:0,eyes:0,eyeColor:'#2fa36b',mark:2,markColor:'#ef4b4b',hat:4,coat:5}],
    ['🦋 Fluttershy',{race:2,bodyColor:'#fff3a6',mane:6,tail:6,maneColor:'#ffb3d9',streak:0,eyes:3,eyeColor:'#18a7b5',mark:5,markColor:'#ec4f97'}],
    ['🎧 DJ Pon-3',{race:1,bodyColor:'#f6f4f8',mane:1,tail:1,maneColor:'#4aa8f0',maneColor2:'#2f3a7a',streak:2,eyes:2,eyeColor:'#c8166b',mark:10,markColor:'#2f3a7a',glasses:2,hat:11,accessoryColor:'#4aa8f0',effect:7}],
    ['🎀 Pouliche',{race:0,silhouette:0,bodyColor:'#fff3a6',mane:8,tail:4,maneColor:'#ef4b4b',maneColor2:'#ff6fa8',streak:0,eyes:6,eyeColor:'#c97a1f',mark:0,hat:1,accessoryColor:'#ff6fa8'}],
    ['🌙 Luna',{race:3,silhouette:3,bodyColor:'#2f3a7a',mane:6,tail:6,maneColor:'#4aa8f0',maneColor2:'#2d2a3e',streak:0,eyes:7,eyeColor:'#18a7b5',mark:8,markColor:'#ffffff',hat:3,neck:2,accessoryColor:'#2d2a3e',effect:4}],
    ['☀️ Celestia',{race:3,silhouette:3,bodyColor:'#f6f4f8',mane:6,tail:6,maneColor:'#4cc38a',maneColor2:'#8f6ae0',streak:4,eyes:1,eyeColor:'#d14d8c',mark:7,markColor:'#ffd43b',hat:2,neck:2,accessoryColor:'#ff6fa8',effect:2}]
  ];
  const linkTail=window.PONY_MANE_TAIL||[], base=window.defaultPony();
  let active=0, history=[], future=[], look=null, mood='happy', rolling=false, quipAt=0;
  const pick=a=>a[Math.floor(Math.random()*a.length)];
  const same=(a,b)=>JSON.stringify(a)===JSON.stringify(b);
  const looks=presets.map(([label,o])=>({label,pony:Object.assign(window.defaultPony(),o)}));
  const QUIPS={hat:['Ce chapeau ? Audacieux.','Un chapeau pareil, ça se mérite.'],glasses:['Les lunettes : +30 % de charisme. C’est scientifique.'],effect:['Des effets spéciaux ! Le budget de l’émission explose.'],clothes:['Tenue de gala validée par la production.'],mane:['Cette crinière va faire des jaloux.'],bodyColor:['Couleur de pelage osée. J’adore. Je crois.'],mark:['Marque de beauté enregistrée au registre des stars.'],eyes:['Ce regard… la caméra 3 est conquise.'],neck:['Un accessoire de cou ? Très red carpet.'],race:['Changement d’espèce. On ne juge pas, on filme.']};
  const quip=k=>{if(Date.now()-quipAt<6000||!QUIPS[k]||!window.ShowTV)return;quipAt=Date.now();window.ShowTV.say('hype',pick(QUIPS[k]),2600);};
  const commit=(next,label=null)=>{if(same(next,pony))return;history.push(JSON.stringify(pony));if(history.length>40)history.shift();future=[];pony=next;look=label;paint(true);};
  const set=(k,v)=>{const n=Object.assign({},pony);if(k==='mane'&&Number(n.tail)===linkTail[Number(n.mane)||0])n.tail=linkTail[v]||0;n[k]=v;commit(n);quip(k);};
  const randomPony=()=>{
    const r=pick, mn=Math.floor(Math.random()*cat.manes.length);
    return Object.assign(window.defaultPony(),{race:r([0,1,2,3]),silhouette:r([0,1,1,2,3]),coat:r([0,0,0,1,2,3,4,5,6]),coatColor:r(['#ffffff','#fff3a6','#3d3d4f']),bodyColor:r(pal.body),mane:mn,tail:linkTail[mn]||0,streak:r([0,0,1,2,3,4]),maneColor:r(pal.mane),maneColor2:r(pal.mane),eyes:Math.floor(Math.random()*cat.eyes.length),glasses:Math.random()<.2?1+Math.floor(Math.random()*(cat.glasses.length-1)):0,effect:Math.random()<.3?1+Math.floor(Math.random()*(cat.effects.length-1)):0,clothes:Math.random()<.2?1+Math.floor(Math.random()*(cat.clothes.length-1)):0,eyeColor:r(pal.eye),mark:1+Math.floor(Math.random()*(cat.marks.length-1)),markColor:r(pal.mane),accessoryColor:r(pal.accent),hat:Math.random()<.35?1+Math.floor(Math.random()*(cat.hats.length-1)):0,neck:Math.random()<.3?1+Math.floor(Math.random()*(cat.necks.length-1)):0});
  };
  const keysOf=t=>[...(t.items||[]).map(x=>x[0]),...(t.colors||[]).map(x=>x[0])];
  const changed=t=>keysOf(t).some(k=>String(pony[k]??'')!==String(base[k]??''));
  const tabIcon=l=>l.split(' ')[0], tabText=l=>l.split(' ').slice(1).join(' ');
  const MOODS=[['happy','😄','Joie'],['smug','😏','Frime'],['grimace','😬','Gêne'],['sleepy','😴','Sieste']];
  document.body.classList.add('cc-open');
  app.innerHTML=`<div class="cc">
    <header class="cc-head"><div class="cc-steps"><span class="done">Inscription</span><i></i><span class="on">Ton personnage</span><i></i><span>Le plateau</span></div>
      <h1 class="cc-title">Crée ton <em>poney</em></h1></header>
    <div class="cc-grid">
      <section class="cc-stage-col">
        <div class="cc-stage"><div class="cc-spot"></div><div class="cc-floor"><i></i></div><div class="cc-pony" id="cc-pony"></div><div class="cc-burst" id="cc-burst"></div><div class="cc-host" id="cc-host"></div>
          <div class="cc-tools"><button type="button" class="cc-tool" id="cc-undo" title="Annuler">↶</button><button type="button" class="cc-tool" id="cc-redo" title="Rétablir">↷</button></div>
          <div class="cc-moods">${MOODS.map(([m,e,t])=>`<button type="button" class="cc-mood" data-mood="${m}" title="${t}">${e}</button>`).join('')}</div></div>
        <div class="cc-plate"><span class="cc-plate-tag">Candidat·e</span><b>${esc(name)}</b><small id="cc-look">Création originale</small></div>
      </section>
      <section class="cc-panel">
        <div class="cc-looks"><div class="cc-label">Looks prêts à porter</div><div class="cc-looks-row">${looks.map((x,i)=>`<button type="button" class="cc-lookcard" data-look="${i}">${window.renderAvatar(x.pony,64,'still')}<span>${esc(x.label)}</span></button>`).join('')}</div></div>
        <nav class="cc-rail" id="cc-rail">${tabs.map((t,i)=>`<button type="button" class="cc-tab" data-cat="${i}"><span class="cc-tab-ico">${tabIcon(t.label)}</span><span class="cc-tab-txt">${esc(tabText(t.label))}</span><i class="cc-dot"></i></button>`).join('')}</nav>
        <div class="cc-options" id="cc-options"></div>
      </section>
    </div>
    <footer class="cc-bar"><button type="button" class="bt-ghost" id="pony-back" title="Retour">←</button><button type="button" class="bt-ghost" id="pony-reset">↻ <span>Réinitialiser</span></button><button type="button" class="alt" id="pony-random">🎲 <span>Aléatoire</span></button><button type="button" id="pony-confirm">Monter sur le plateau ▶</button></footer>
  </div>`;
  const $=id=>document.getElementById(id);
  if(window.Mascot){const h=window.Mascot.mount($('cc-host'));window.Mascot.setStage(h);setTimeout(()=>h.say(pick(['À toi de jouer ! Fais-moi un look de star.','Les caméras t’attendent. Pas de pression.','Montre-moi ce que tu as dans la crinière.']),'intro',3600),500);}
  function options(){
    const t=tabs[active];
    return `<div class="cc-tabtitle"><span>${tabIcon(t.label)}</span>${esc(tabText(t.label))}</div>`+(t.items||[]).map(([k,list,title,focus])=>{
      const opts=cat[list]||[], cur=Math.max(0,Math.min(opts.length-1,Number(pony[k])||0));
      const hide={eyes:{glasses:0,hat:0},mane:{hat:0,glasses:0},streak:{hat:0,glasses:0},glasses:{hat:0},mark:{clothes:0},neck:{clothes:0}}[k]||{};
      return `<div class="cc-section"><div class="cc-label">${esc(title)} <small>${cur+1}/${opts.length}</small></div><div class="cc-tiles">${opts.map((o,i)=>{
        const preview=Object.assign({},pony,k==='effect'?{}:{effect:0},hide,{[k]:i});
        return `<button type="button" class="cc-tile ${i===cur?'active':''}" data-k="${k}" data-v="${i}">${window.renderAvatar(preview,86,'still',focus)}<span>${esc(o)}</span></button>`;
      }).join('')}</div></div>`;
    }).join('')+(t.colors||[]).map(([k,title,pk])=>`<div class="cc-section"><div class="cc-label">${esc(title)}</div><div class="cc-swatches">${(pal[pk]||[]).map(c=>`<button type="button" class="cc-swatch ${String(pony[k]).toLowerCase()===c?'active':''}" data-k="${k}" data-color="${c}" style="--c:${c}" aria-label="${c}"></button>`).join('')}<label class="cc-custom" title="Couleur sur mesure"><input class="custom-color-input" data-k="${k}" type="color" value="${pony[k]||'#ffffff'}"><span>＋</span></label></div></div>`).join('');
  }
  function paint(bump){
    $('cc-pony').innerHTML=window.renderAvatar(pony,300,mood);
    if(bump){const el=$('cc-pony');el.classList.remove('pop');void el.offsetWidth;el.classList.add('pop');const b=$('cc-burst');b.classList.remove('on');void b.offsetWidth;b.classList.add('on');}
    const match=looks.find(x=>same(x.pony,pony));
    $('cc-look').textContent=match?'Look : '+match.label:(look||'Création originale');
    app.querySelectorAll('.cc-lookcard').forEach((b,i)=>b.classList.toggle('active',looks[i]===match));
    app.querySelectorAll('.cc-tab').forEach((b,i)=>{b.classList.toggle('active',i===active);b.classList.toggle('changed',changed(tabs[i]));});
    app.querySelectorAll('.cc-mood').forEach(b=>b.classList.toggle('active',b.dataset.mood===mood));
    const keep=$('cc-options').scrollTop;$('cc-options').innerHTML=options();$('cc-options').scrollTop=keep;
    $('cc-undo').disabled=!history.length;$('cc-redo').disabled=!future.length;
  }
  const centerTab=()=>{const rail=$('cc-rail'),ac=rail.querySelector('.active');if(ac&&rail.scrollWidth>rail.clientWidth)rail.scrollLeft=ac.offsetLeft-rail.offsetWidth/2+ac.offsetWidth/2;};
  app.querySelector('.cc').addEventListener('click',e=>{
    const b=e.target.closest('button');if(!b||rolling)return;
    if(b.dataset.cat!==undefined){active=+b.dataset.cat;paint(false);centerTab();return;}
    if(b.dataset.k&&b.dataset.v!==undefined)return set(b.dataset.k,+b.dataset.v);
    if(b.dataset.k&&b.dataset.color)return set(b.dataset.k,b.dataset.color);
    if(b.dataset.look!==undefined){const x=looks[+b.dataset.look];commit(JSON.parse(JSON.stringify(x.pony)),'Look : '+x.label);return;}
    if(b.dataset.mood){mood=b.dataset.mood;paint(false);return;}
  });
  app.querySelector('.cc').addEventListener('change',e=>{const i=e.target.closest('.custom-color-input');if(i)set(i.dataset.k,i.value);});
  $('cc-undo').onclick=()=>{if(!history.length)return;future.push(JSON.stringify(pony));pony=JSON.parse(history.pop());look=null;paint(true);};
  $('cc-redo').onclick=()=>{if(!future.length)return;history.push(JSON.stringify(pony));pony=JSON.parse(future.pop());look=null;paint(true);};
  $('pony-reset').onclick=()=>commit(window.defaultPony());
  $('pony-random').onclick=()=>{
    if(rolling)return;rolling=true;const start=JSON.stringify(pony);let n=0;
    const spin=setInterval(()=>{pony=randomPony();$('cc-pony').innerHTML=window.renderAvatar(pony,300,'still');window.partyAudio.tick();
      if(++n>=8){clearInterval(spin);rolling=false;const final=randomPony();pony=JSON.parse(start);commit(final,'Tirage au sort 🎲');window.partyAudio.good(2);if(window.ShowTV)window.ShowTV.say('hype',pick(['Le hasard a parlé ! Il a du goût.','Tirage au sort ! Personne n’est responsable de ce look.','La roue du style a tranché.']),2600);}},85);
  };
  $('pony-back').onclick=()=>{document.body.classList.remove('cc-open');form();};
  $('pony-confirm').onclick=()=>{
    chosenAvatar=JSON.parse(JSON.stringify(pony));localStorage.setItem('pg-avatar',JSON.stringify(chosenAvatar));window.partyAudio.enable();
    if(window.ShowTV){window.ShowTV.flash('#ffd60a');window.ShowTV.confetti(90);window.ShowTV.say('win',`${name} entre sur le plateau ! Quel style.`,3200);}
    document.body.classList.remove('cc-open');join(code,name,null,chosenAvatar);
  };
  paint(false);
}

s.on('state', x => {
  window.AVATARS = x.avatars || window.AVATARS || [];
  st = x; off = x.now - Date.now();
  window.partyAudio.update(x);
  if (!x.me) return;
  const p = x.phase, done = p.answered.includes(x.me.id);
  const k = p.n + ':' + done;
  const justSent = done && key === p.n + ':false';
  if (k !== key || p.kind === 'survey' || p.kind === 'bossPick' || p.kind === 'pixel') { key = k; render(p, done); } // mises à jour en direct (Grand Sondage, choix des héros, Pixel Flou)
  try { window.ShowTV.onState(x); if (justSent) window.ShowTV.answered(); window.ShowTV.decorate(app); } catch (err) { console.error('[show]', err); }
});
window.ShowTV.watch({ role: 'player', me: () => st && st.me && st.me.id });

setInterval(() => { if (st && st.phase && st.phase.kind==='lobby' && st.me) render(st.phase, st.phase.answered.includes(st.me.id)); }, 6500);

setInterval(() => {
  const t = document.getElementById('t');
  if (t && st && st.phase.endsAt) t.textContent = Math.max(0, Math.ceil((st.phase.endsAt - Date.now() - off) / 1000));
}, 250);

const me = () => st.players.find(x => x.id === st.me.id) || { name: '', score: 0 };
const wait = msg => `<div class="card stack"><p class="prompt">${msg}</p></div>`;
const timer = p => p.endsAt ? '<span class="timer" id="t"></span>' : '';
const socialScene = (r, final=false) => { const text=window.partyBanter.pick(r,Math.floor(Date.now()/6500)); const cls=['winner','p2','p3','p4','p5']; return `<div class="rank-scene has-banter"><div class="scene-prop banter">${esc(text)}</div><div class="scene-floor"></div>${r.slice(0,5).map((x,i)=>`<div class="scene-player ${cls[i]}"><div>${avatarMarkup(x.avatar,76,['smug','grimace','sleepy','happy','smug'][i%5])}</div><span class="scene-name">${esc(x.name)}</span></div>`).join('')}</div>`; };
const lobbyRanking = () => { const r=[...(st?.players||[])].sort((a,b)=>b.score-a.score); return `<section class="home-ranking"><div class="section-title"><span>🏆 Classement</span><small>la partie commence déjà à chambrer</small></div>${r.length?socialScene(r):'<div class="empty-ranking">Les premiers joueurs vont apparaître ici 👀</div>'}<div class="rank-board">${r.map((x,i)=>`<div class="rank-row rank-${i+1}"><div class="rank-place">${i+1}</div><div class="rank-avatar">${avatarMarkup(x.avatar,58,['smug','grimace','sleepy','happy'][i%4])}</div><div class="rank-name"><b>${esc(x.name)}</b><span>${x.score} pts</span></div></div>`).join('')}</div></section>`; };

function render(p, done) {
  const m = me();
  const top = `<div class="row player-top"><span class="player-mini">${avatarMarkup(m.avatar,42)}</span><b class="muted">${esc(m.name)} · ${m.score} pts</b>${p.category ? `<span class="chip">${esc(p.category)}</span>` : ''}${p.difficulty ? `<span class="chip diff diff-${p.difficulty.level}">${p.difficulty.stars} ${esc(p.difficulty.label)}</span>` : ''}${timer(p)}</div>`;
  if (!window.BossGame.KINDS.includes(p.kind)) window.BossGame.leave();
  if (window.BossGame.KINDS.includes(p.kind)) {
    window.BossGame.player(app, p, { me: st.me.id, top, players: st.players, off,
      action: v => s.emit('player:action', v), input: v => s.emit('input', v) });
  } else if (p.kind === 'wario' || p.kind === 'warioResults') {
    window.WarioGame.render(app, p, { me: st.me.id, code: st.code, off, done,
      send: v => s.emit('answer', v), progress: v => s.emit('progress', v) });
  } else if (p.kind === 'brain' || p.kind === 'brainResults') {
    window.BrainGame.render(app, p, { me: st.me.id, code: st.code, off, done,
      send: v => s.emit('answer', v), progress: v => s.emit('progress', v) });
  } else if (p.kind === 'academy' || p.kind === 'academyResults') {
    window.AcademyGame.render(app, p, { me: st.me.id, code: st.code, off,
      send: v => s.emit('answer', v), progress: v => s.emit('progress', v) });
  } else if (p.kind === 'survey') {
    window.SurveyGame.player(app, p, { me: st.me.id, top, send: (guess, cb) => s.emit('player:action', { guess }, cb) });
  } else if (p.kind === 'pixel') {
    window.PixelGame.player(app, p, { me: st.me.id, top, off, send: (guess, cb) => s.emit('player:action', { guess }, cb) });
  } else if (p.kind === 'surveySetup') {
    app.innerHTML = `${top}${wait('📊 Le Grand Sondage<br>L’hôte choisit le thème…')}`;
  } else if (p.kind === 'boardSpin') {
    const d = p.data, left = Math.max(0, d.spinAt + d.spinMs - Date.now() - off);
    const show = () => `<div class="card stack board-phone"><div class="eyebrow">🎲 Tour ${p.round}/${p.rounds}${d.final ? ' · points ×2 🔥' : ''}</div>
      ${Date.now() + off >= d.spinAt + d.spinMs ? `<div class="board-phone-icon">${d.chosen.icon}</div><p class="prompt">${esc(d.chosen.name)}</p><p class="muted">${esc(d.chosen.desc || '')}</p>` : '<div class="board-phone-icon spin">🎡</div><p class="prompt">La roue tourne… regardez l’écran !</p>'}</div>`;
    app.innerHTML = `${top}${show()}`;
    if (left) setTimeout(() => { if (st.phase.n === p.n) app.innerHTML = `${top}${show()}`; }, left + 50);
  } else if (p.kind === 'boardResults') {
    const d = p.data, mine = d.rows.find(r => r.id === st.me.id), rank = d.standings.findIndex(x => x.id === st.me.id) + 1;
    app.innerHTML = `${top}<div class="card stack board-phone"><div class="eyebrow">🎲 ${d.game.icon} ${esc(d.game.name)}</div>
      ${mine ? `<div class="board-phone-icon">${['🥇', '🥈', '🥉'][mine.place - 1] || '🎲'}</div><p class="prompt">${mine.gain ? `+${mine.gain} points de plateau !` : 'Pas de point cette fois…'}</p>` : '<p class="prompt">Regardez l’écran !</p>'}
      <p class="muted">Vous êtes ${rank}ᵉ sur ${d.standings.length} au plateau${d.last ? ' — fin de partie !' : ` · encore ${d.turns - d.turn} tour${d.turns - d.turn > 1 ? 's' : ''}`}</p></div>`;
  } else if (p.kind === 'lobby') {
    app.innerHTML = `${top}${wait(`Vous êtes dans la partie ${st.code}. L'hôte va lancer un jeu.`)}${lobbyRanking()}`;
  } else if (p.kind === 'text' || p.kind === 'number') {
    if (done) { app.innerHTML = `${top}${wait('Réponse envoyée ✓<br>Attendez les autres.')}`; return; }
    const field = p.kind === 'text'
      ? '<textarea id="a" rows="3" maxlength="120" placeholder="Votre réponse"></textarea>'
      : `<input id="a" inputmode="decimal" placeholder="Votre estimation ${esc(p.unit || '')}" autocomplete="off">`;
    app.innerHTML = `${top}<div class="card stack"><p class="prompt">${esc(p.prompt)}</p>${field}<button id="ok">Envoyer</button></div>`;
    document.getElementById('ok').onclick = () => s.emit('answer', document.getElementById('a').value);
  } else if (p.kind === 'guess') {
    if (!done && !p.expected.includes(st.me.id)) {
      app.innerHTML = `${top}${wait(p.data.found.includes(st.me.id) ? 'Bonne réponse ✓<br>Attendez les autres.' : 'Vos amis cherchent… 🤞')}`; return;
    }
    if (done) { app.innerHTML = `${top}${wait('Bonne réponse ✓<br>Attendez les autres.')}`; return; }
    const cl = c => `<div class="clue ${/^[^\p{L}]+$/u.test(c) ? 'emoji' : ''}">${esc(c)}</div>`;
    app.innerHTML = `${top}<div class="card stack"><p class="prompt">${esc(p.prompt)}</p>${p.data.clues.map(cl).join('')}
      <input id="a" placeholder="Votre réponse" autocomplete="off" autocapitalize="off">
      <button id="ok">Envoyer</button><p class="msg" id="msg"></p></div>`;
    const el = document.getElementById('a');
    const send = () => { window.partyAudio.click(); s.emit('answer', el.value, r => {
      if (r === 'invalid') { window.partyAudio.error(); document.getElementById('msg').textContent = 'Ce n\'est pas ça, réessayez !'; el.value = ''; el.focus(); }
    }); };
    document.getElementById('ok').onclick = send;
    el.onkeydown = e => { if (e.key === 'Enter') send(); };
  } else if (p.kind === 'rank') {
    if (done) { app.innerHTML = `${top}${wait('Classement envoyé ✓<br>Attendez les autres.')}`; return; }
    const order = p.data.items.map(x => x.id);
    const txt = Object.fromEntries(p.data.items.map(x => [x.id, x.text]));
    app.innerHTML = `${top}<div class="card stack"><p class="prompt">${esc(p.prompt)}</p><div id="rk" class="stack"></div><button id="ok">Valider mon classement</button></div>`;
    const list = document.getElementById('rk');
    const draw = () => { list.innerHTML = order.map((id, i) => `<div class="rk"><b>${i + 1}</b><span>${esc(txt[id])}</span><button data-i="${i}" data-d="-1">▲</button><button data-i="${i}" data-d="1">▼</button></div>`).join(''); };
    list.onclick = e => {
      const b = e.target.closest('button'); if (!b) return;
      const i = +b.dataset.i, j = i + +b.dataset.d;
      if (j < 0 || j >= order.length) return;
      [order[i], order[j]] = [order[j], order[i]]; draw();
    };
    draw();
    document.getElementById('ok').onclick = () => s.emit('answer', order);
  } else if (p.kind === 'truths') {
    if (done) { app.innerHTML = `${top}${wait('Envoyé ✓<br>Attendez les autres.')}`; return; }
    app.innerHTML = `${top}<div class="card stack"><p class="prompt">Écrivez 2 vérités et 1 mensonge sur vous, puis cochez le mensonge.</p>
      ${[0, 1, 2].map(i => `<input id="s${i}" maxlength="100" placeholder="Affirmation ${i + 1}" autocomplete="off"><label><input type="radio" name="lie" value="${i}">C'est le mensonge</label>`).join('')}
      <button id="ok">Envoyer</button><p class="msg" id="msg"></p></div>`;
    document.getElementById('ok').onclick = () => {
      const lie = document.querySelector('input[name=lie]:checked');
      s.emit('answer', { s: [0, 1, 2].map(i => document.getElementById('s' + i).value), lie: lie ? +lie.value : -1 },
        r => { if (r === 'invalid') document.getElementById('msg').textContent = 'Remplissez les 3 affirmations et cochez le mensonge.'; });
    };
  } else if (p.kind === 'describe') {
    const pv = st.me.priv;
    if (!pv) { app.innerHTML = `${top}${wait('Un joueur prépare un indice… 🤫')}`; return; }
    if (done) { app.innerHTML = `${top}${wait('Indice envoyé ✓<br>Vos amis cherchent !')}`; return; }
    app.innerHTML = `${top}<div class="card stack"><p class="prompt">Faites deviner :</p><div class="clue" style="font-size:2rem">${esc(pv.word)}</div>
      <div class="chips">${pv.forbidden.map(w => `<span class="chip bad">${esc(w)}</span>`).join('')}</div>
      <p>Interdit : ce mot et ceux en rose !</p>
      <textarea id="a" rows="3" maxlength="120" placeholder="Votre indice"></textarea>
      <button id="ok">Envoyer</button><p class="msg" id="msg"></p></div>`;
    document.getElementById('ok').onclick = () => s.emit('answer', document.getElementById('a').value,
      r => { if (r === 'invalid') document.getElementById('msg').textContent = 'Mot interdit utilisé, ou texte vide. Reformulez !'; });
  } else if (p.kind === 'draw') {
    clearInterval(window._dt);
    const pv = st.me.priv;
    if (pv) {
      app.innerHTML = `${top}<div class="card stack"><p class="prompt">Dessinez : <b>${esc(pv.word)}</b></p>
        <div class="draw-toolbar">
          <div class="draw-tools">
            <button type="button" class="draw-tool active" data-tool="pen">✏️ Crayon</button>
            <button type="button" class="draw-tool" data-tool="eraser">🧽 Gomme</button>
            <button type="button" class="draw-tool" data-tool="fill">🪣 Remplir</button>
          </div>
          <div class="draw-colors">
            ${['#1d1a3b','#e74c3c','#f39c12','#f1c40f','#2ecc71','#3498db','#9b59b6','#ff69b4','#ffffff'].map(color => `<button type="button" class="draw-color ${color==='#1d1a3b'?'active':''}" data-color="${color}" style="background:${color}" aria-label="Couleur ${color}"></button>`).join('')}
          </div>
          <div class="draw-widths">
            <button type="button" class="draw-width active" data-width="5">●</button>
            <button type="button" class="draw-width" data-width="12">●</button>
            <button type="button" class="draw-width" data-width="24">●</button>
            <button type="button" class="draw-width" data-width="42">●</button>
          </div>
        </div>
        <canvas id="cv" class="board" width="600" height="450"></canvas>
        <div class="row"><button id="undo" class="alt">↶ Annuler</button><button id="clr" class="alt">Effacer</button></div>
        <p class="msg" id="draw-msg">Choisissez un outil, une couleur et une épaisseur.</p>
      </div>`;
      const cv = document.getElementById('cv'), c = cv.getContext('2d', { willReadFrequently:true });
      c.lineCap = 'round'; c.lineJoin = 'round';
      let last = null, buf = [], sending = false, tool = 'pen', color = '#1d1a3b', width = 5;
      const pos = e => { const r = cv.getBoundingClientRect(); return [Math.max(0, Math.min(1, (e.clientX-r.left)/r.width)), Math.max(0, Math.min(1, (e.clientY-r.top)/r.height))]; };
      const styleNow = () => { c.strokeStyle = tool === 'eraser' ? '#ffffff' : color; c.lineWidth = width; };
      const line = (a,b) => { styleNow(); c.beginPath(); c.moveTo(a[0]*cv.width,a[1]*cv.height); c.lineTo(b[0]*cv.width,b[1]*cv.height); c.stroke(); };
      const floodFill = (x,y,fillColor) => {
        const w=cv.width,h=cv.height, px=Math.floor(x*w), py=Math.floor(y*h), img=c.getImageData(0,0,w,h), d=img.data;
        const at=(xx,yy)=> (yy*w+xx)*4, idx=at(px,py), target=[d[idx],d[idx+1],d[idx+2],d[idx+3]];
        const fc=fillColor==='#ffffff'?[255,255,255,255]:((n)=>[n>>16,(n>>8)&255,n&255,255])(parseInt(fillColor.slice(1),16));
        if(target[0]===fc[0]&&target[1]===fc[1]&&target[2]===fc[2]&&target[3]===fc[3]) return;
        const same=(i)=>d[i]===target[0]&&d[i+1]===target[1]&&d[i+2]===target[2]&&d[i+3]===target[3];
        const stack=[[px,py]], seen=new Uint8Array(w*h);
        while(stack.length){ const [cx,cy]=stack.pop(); if(cx<0||cy<0||cx>=w||cy>=h) continue; const si=cy*w+cx; if(seen[si]) continue; const i=si*4; if(!same(i)) continue; seen[si]=1; d[i]=fc[0];d[i+1]=fc[1];d[i+2]=fc[2];d[i+3]=fc[3]; stack.push([cx+1,cy],[cx-1,cy],[cx,cy+1],[cx,cy-1]); }
        c.putImageData(img,0,0);
      };
      const flush = () => { if(!buf.length||sending)return; const segs=buf.splice(0,80); sending=true; s.emit('draw',{action:'segments',segs,color,width,tool},()=>{sending=false;if(buf.length)flush();}); };
      const sendAction = action => { s.emit('draw', action); };
      cv.onpointerdown=e=>{
        e.preventDefault(); cv.setPointerCapture(e.pointerId); const q=pos(e);
        if(tool==='fill'){ floodFill(q[0],q[1],color); sendAction({action:'fill',x:q[0],y:q[1],color}); return; }
        last=q; line(last,last); buf.push([...last,...last]); flush();
      };
      cv.onpointermove=e=>{ if(!last||tool==='fill')return; e.preventDefault(); const q=pos(e); line(last,q); buf.push([...last,...q]); last=q; if(buf.length>=6)flush(); };
      const endStroke=()=>{last=null;flush();}; cv.onpointerup=cv.onpointercancel=cv.onpointerleave=endStroke;
      document.querySelectorAll('.draw-tool').forEach(b=>b.onclick=()=>{tool=b.dataset.tool;document.querySelectorAll('.draw-tool').forEach(x=>x.classList.toggle('active',x===b));});
      document.querySelectorAll('.draw-color').forEach(b=>b.onclick=()=>{color=b.dataset.color;document.querySelectorAll('.draw-color').forEach(x=>x.classList.toggle('active',x===b));});
      document.querySelectorAll('.draw-width').forEach(b=>b.onclick=()=>{width=+b.dataset.width;document.querySelectorAll('.draw-width').forEach(x=>x.classList.toggle('active',x===b));});
      document.getElementById('clr').onclick=()=>{c.clearRect(0,0,cv.width,cv.height);buf=[];last=null;sendAction({action:'clear'});};
      document.getElementById('undo').onclick=()=>sendAction({action:'undo'});
      window._dt=setInterval(flush,30);
      return;
    }
    if(done){ app.innerHTML=`${top}${wait('Bien joué ✓<br>Attendez les autres.')}`; return; }
    app.innerHTML = `${top}<div class="card stack"><p class="prompt">Regardez l'écran et devinez le dessin !</p>
      <input id="a" placeholder="Votre réponse" autocomplete="off" autocapitalize="off">
      <button id="ok">Envoyer</button><p class="msg" id="msg"></p></div>`;
    const el = document.getElementById('a');
    const send = () => { window.partyAudio.click(); s.emit('answer', el.value, r => {
      if (r === 'invalid') { window.partyAudio.error(); document.getElementById('msg').textContent = 'Ce n\'est pas ça, réessayez !'; el.value = ''; el.focus(); }
    }); };
    document.getElementById('ok').onclick = send;
    el.onkeydown = e => { if (e.key === 'Enter') send(); };
  } else if (p.kind === 'vote') {
    if (done) { app.innerHTML = `${top}${wait('Vote enregistré ✓')}`; return; }
    const opts = p.options.filter(o => !st.me.mine.includes(o.id));
    app.innerHTML = `${top}<div class="card stack"><p class="prompt">${esc(p.prompt)}</p>
      ${opts.map(o => `<button class="choice" data-o="${o.id}">${esc(o.text)}</button>`).join('')}</div>`;
    app.querySelectorAll('[data-o]').forEach(b => b.onclick = () => s.emit('answer', b.dataset.o));
  } else if (p.kind === 'reveal') {
    app.innerHTML = `${top}${p.data?.survey ? `<div class="card stack"><p class="prompt">${esc(p.title)}</p>${window.SurveyGame.reveal(p.data.survey)}</div>` : p.data?.pixel ? `<div class="card stack">${window.PixelGame.reveal(p.data.pixel)}</div>` : wait('Regardez l\'écran !')}`;
  } else if (p.kind === 'scores') {
    const r = [...st.players].sort((a, b) => b.score - a.score);
    const i = r.findIndex(x => x.id === st.me.id), mine = r[i] || me(), tie = r.length > 1 && r.filter(x => x.score === mine.score).length > 1;
    const last = r.length > 1 && i === r.length - 1 && !tie;
    const label = tie ? 'Égalité !' : i === 0 ? 'Victoire !' : last ? 'Défaite…' : i === 1 ? 'Si près !' : 'Bien joué';
    app.innerHTML = `${top}<section class="phone-final rank-${Math.min(i + 1, 4)} ${last ? 'last' : ''}"><div class="tv-episode">Résultats · ${r.length} candidat${r.length > 1 ? 's' : ''}</div>
      <div class="pf-place">${i + 1}<sup>${i === 0 ? 'er' : 'e'}</sup></div><h1 class="pf-title">${label}</h1><div class="pf-score"><span data-count="${mine.score}">${mine.score}</span> pts</div></section>
      <div class="pf-list">${r.map((x, k) => `<div class="rest-row ${x.id === st.me.id ? 'me' : ''}"><span class="rest-place">${k + 1}</span>${avatarMarkup(x.avatar, 44, k === 0 ? 'smug' : 'happy')}<b>${esc(x.name)}</b><strong>${x.score.toLocaleString('fr-FR')}</strong></div>`).join('')}</div>`;
  }
}
</script></body></html>
